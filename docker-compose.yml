services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-course}
      # Пароли identity-ролей, которые создаёт postgres-init/00-bootstrap-roles.sh
      # (выполняется один раз при первой инициализации volume). Дефолты — только
      # для локальной разработки и автопроверки, как и POSTGRES_PASSWORD выше.
      COURSE_MIGRATOR_PASSWORD: ${COURSE_MIGRATOR_PASSWORD:-course_migrator_dev_password}
      COURSE_PUBLISHER_PASSWORD: ${COURSE_PUBLISHER_PASSWORD:-course_publisher_dev_password}
      COURSE_RUNTIME_PASSWORD: ${COURSE_RUNTIME_PASSWORD:-course_runtime_dev_password}
    volumes:
      - course_pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-course}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moduldev-network
    restart: unless-stopped


  cli:
    build:
      context: .
      dockerfile: Cli/Dockerfile
    command: ["migration", "apply", "/app/Migrations/ChecksummedMigrations"]
    restart: "no"
    volumes:
      - ./Api/Migrations:/app/Migrations
    environment:
      # "cli migration apply" — только под course_migrator (DDL-права
      # получает через SET ROLE course_owner внутри самих файлов миграций).
      - ConnectionStrings__CourseDbMigration=Host=postgres;Database=${POSTGRES_DB:-course};Username=course_migrator;Password=${COURSE_MIGRATOR_PASSWORD:-course_migrator_dev_password}
      # "cli action publish/activate/disable/list" — только под course_publisher,
      # который видит исключительно course.action_catalog.
      - ConnectionStrings__CourseDbPublication=Host=postgres;Database=${POSTGRES_DB:-course};Username=course_publisher;Password=${COURSE_PUBLISHER_PASSWORD:-course_publisher_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - moduldev-network
    stdin_open: true
    tty: true

  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      #start_period: 30s
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - COURSE_JWT_ISSUER=${COURSE_JWT_ISSUER:-moduledev-course}
      - COURSE_JWT_AUDIENCE=${COURSE_JWT_AUDIENCE:-moduledev-api}
      - COURSE_JWT_SIGNING_KEY=${COURSE_JWT_SIGNING_KEY:-dev-only-signing-key-please-override-32bytes-min}
      # Боевой трафик — только под course_runtime, никогда под POSTGRES_USER.
      - ConnectionStrings__CourseDb=Host=postgres;Database=${POSTGRES_DB:-course};Username=course_runtime;Password=${COURSE_RUNTIME_PASSWORD:-course_runtime_dev_password}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      cli:
        condition: service_completed_successfully
    networks:
      - moduldev-network
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - Api__Url=http://api:8080
    depends_on:
      api:
        condition: service_healthy
    networks:
      - moduldev-network
    restart: unless-stopped

volumes:
  course_pgdata:

networks:
  moduldev-network:
    driver: bridge
