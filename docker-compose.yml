services:
  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    container_name: moduldev-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-course}
      COURSE_MIGRATOR_PASSWORD: ${COURSE_MIGRATOR_PASSWORD:-course_migrator_pw}
      COURSE_PUBLISHER_PASSWORD: ${COURSE_PUBLISHER_PASSWORD:-course_publisher_pw}
      # TODO(checker): docs/configuration.md требует COURSE_RUNTIME_PASSWORD
      # для postgres+api и COURSE_WORKER_PASSWORD для postgres+workers.
      # Пока НЕ прокидываю их сюда, потому что не видел Cli/ — неясно,
      # кто именно ставит пароль ролям course_runtime/workflow_worker
      # (00-bootstrap-roles.sh их не создаёт; это делают миграции или cli).
      # После проверки Cli/ добавить сюда:
      #   COURSE_RUNTIME_PASSWORD: ${COURSE_RUNTIME_PASSWORD:-course_runtime_pw}
      #   COURSE_WORKER_PASSWORD: ${COURSE_WORKER_PASSWORD:-workflow_worker_pw}
      COURSE_OUTBOX_PASSWORD: ${COURSE_OUTBOX_PASSWORD:-outbox_dispatcher_pw}
      COURSE_INBOX_PASSWORD: ${COURSE_INBOX_PASSWORD:-inbox_reconciler_pw}
    volumes:
      - course_pgdata:/var/lib/postgresql/data
     
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-course}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moduldev-network
    restart: unless-stopped

  cli:
    build:
      context: .
      dockerfile: Cli/Dockerfile
    container_name: moduldev-cli
    restart: "no"
    environment:
      - ConnectionStrings__CourseDb=Host=postgres;Database=${POSTGRES_DB:-course};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - COURSE_JWT_ISSUER=${COURSE_JWT_ISSUER}
      - COURSE_JWT_AUDIENCE=${COURSE_JWT_AUDIENCE}
      - COURSE_JWT_SIGNING_KEY=${COURSE_JWT_SIGNING_KEY}
      # TODO(checker): по таблице переменная должна называться
      # COURSE_WORKER_PASSWORD. Сейчас cli читает
      # COURSE_WORKFLOW_WORKER_PASSWORD (см. лог "password set from
      # COURSE_WORKFLOW_WORKER_PASSWORD"). Перед переименованием
      # убедиться, что Cli/Program.cs действительно ждёт новое имя —
      # иначе роль workflow_worker останется со старым паролем.
      - COURSE_WORKFLOW_WORKER_PASSWORD=${COURSE_WORKFLOW_WORKER_PASSWORD:-workflow_worker_pw}
      - COURSE_TEST_PROFILE=${COURSE_TEST_PROFILE:-1}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - moduldev-network
    stdin_open: true
    tty: true

  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    container_name: moduldev-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - COURSE_JWT_ISSUER=${COURSE_JWT_ISSUER}
      - COURSE_JWT_AUDIENCE=${COURSE_JWT_AUDIENCE}
      - COURSE_JWT_SIGNING_KEY=${COURSE_JWT_SIGNING_KEY}
      - PROVIDER_HMAC_SECRET=${PROVIDER_HMAC_SECRET}
      # TODO(checker): docs/configuration.md требует, чтобы api ходил под
      # least-privilege course_runtime, а не под суперпользователем postgres.
      # Но пока cli/init не подтверждены как источник пароля для
      # course_runtime — оставляю как есть, иначе api не поднимется.
      # После проверки Cli/ заменить на:
      #   Username=course_runtime;Password=${COURSE_RUNTIME_PASSWORD:-course_runtime_pw}
      - ConnectionStrings__CourseDb=Host=postgres;Database=${POSTGRES_DB:-course};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - COURSE_TEST_PROFILE=${COURSE_TEST_PROFILE:-1}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      cli:
        condition: service_completed_successfully
    networks:
      - moduldev-network
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    container_name: moduldev-gateway
    ports:
      - "127.0.0.1:${COURSE_GATEWAY_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - Api__Url=http://api:8080
      - COURSE_TEST_PROFILE=${COURSE_TEST_PROFILE:-1}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - moduldev-network
    restart: unless-stopped

  worker-a:
    image: moduledev-week2-worker:latest
    build:
      context: .
      dockerfile: Workflow.Worker/Dockerfile
    container_name: moduldev-worker-a
    environment:
      - ConnectionStrings__CourseDb=Host=postgres;Database=${POSTGRES_DB:-course};Username=workflow_worker;Password=${COURSE_WORKFLOW_WORKER_PASSWORD:-workflow_worker_pw}
      - COURSE_INSTANCE_ID=worker-a
      - COURSE_TEST_PROFILE=${COURSE_TEST_PROFILE:-1}
      - COURSE_FAILPOINT=${COURSE_FAILPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      cli:
        condition: service_completed_successfully
    networks:
      - moduldev-network
    restart: unless-stopped

  worker-b:
    image: moduledev-week2-worker:latest
    build:
      context: .
      dockerfile: Workflow.Worker/Dockerfile
    container_name: moduldev-worker-b
    environment:
      - ConnectionStrings__CourseDb=Host=postgres;Database=${POSTGRES_DB:-course};Username=workflow_worker;Password=${COURSE_WORKFLOW_WORKER_PASSWORD:-workflow_worker_pw}
      - COURSE_INSTANCE_ID=worker-b
      - COURSE_TEST_PROFILE=${COURSE_TEST_PROFILE:-1}
      - COURSE_FAILPOINT=${COURSE_FAILPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      cli:
        condition: service_completed_successfully
    networks:
      - moduldev-network
    restart: unless-stopped

  outbox-dispatcher:
    image: moduledev-python:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moduldev-outbox-dispatcher
    command: ["dispatcher"]
    environment:
      - COURSE_OUTBOX_USER=outbox_dispatcher
      - COURSE_OUTBOX_PASSWORD=${COURSE_OUTBOX_PASSWORD:-outbox_dispatcher_pw}
      - PGUSER=outbox_dispatcher
      - PGPASSWORD=${COURSE_OUTBOX_PASSWORD:-outbox_dispatcher_pw}
      - OUTBOX_OWNER=outbox-dispatcher
      - PROVIDER_URL=${PROVIDER_URL:-http://provider-simulator:8081}
      - COURSE_TEST_PROFILE=${COURSE_TEST_PROFILE:-1}
    depends_on:
      postgres:
        condition: service_healthy
      cli:
        condition: service_completed_successfully
    networks:
      - moduldev-network
    restart: unless-stopped

  receipt-adapter:
    image: moduledev-python:latest
    container_name: moduldev-receipt-adapter
    command: ["adapter"]
    environment:
      - PROVIDER_CALLBACK_CAPABILITY=${PROVIDER_CALLBACK_CAPABILITY}
      - PROVIDER_CALLBACK_TOKEN=${PROVIDER_CALLBACK_TOKEN}
      - PROVIDER_HMAC_SECRET=${PROVIDER_HMAC_SECRET}
      - RECEIPT_API_URL=${RECEIPT_API_URL:-http://gateway:8080/api/receipt/accept}
      # FIX: adapter теперь слушает 8080 (см. receipt_adapter.py,
      # RECEIPT_ADAPTER_PORT с дефолтом 8080). Это совпадает с
      # CALLBACK_URL у provider-simulator'а
      # (http://receipt-adapter:8080/callbacks/...), и provider
      # больше не получает "connection refused".
      - RECEIPT_ADAPTER_PORT=8080
      - COURSE_TEST_PROFILE=${COURSE_TEST_PROFILE:-1}
    depends_on:
      gateway:
        condition: service_started
    networks:
      - moduldev-network
    restart: unless-stopped

  inbox-reconciler:
    image: moduledev-python:latest
    container_name: moduldev-inbox-reconciler
    command: ["reconciler"]
    environment:
      - COURSE_INBOX_USER=inbox_reconciler
      - COURSE_INBOX_PASSWORD=${COURSE_INBOX_PASSWORD:-inbox_reconciler_pw}
      - PGUSER=inbox_reconciler
      - PGPASSWORD=${COURSE_INBOX_PASSWORD:-inbox_reconciler_pw}
      - COURSE_TEST_PROFILE=${COURSE_TEST_PROFILE:-1}
    depends_on:
      postgres:
        condition: service_healthy
      cli:
        condition: service_completed_successfully
    networks:
      - moduldev-network
    restart: unless-stopped

  provider-simulator:
    image: ghcr.io/fintech-dev-lab/internship-provider-simulator:v0.2.0@sha256:70e5e0dd9ab8425be84de431ec74516f9bedf5d5529077358e2e2b2037fe0c74
    container_name: moduldev-provider-simulator
    environment:
      - CALLBACK_URL=http://receipt-adapter:8080/callbacks/provider-v02/${PROVIDER_CALLBACK_CAPABILITY}
      - AUDIT_TOKEN=${PROVIDER_AUDIT_TOKEN:-audit_token_123}
      # FIX: PROVIDER_CALLBACK_TOKEN здесь НЕ нужен — по
      # docs/external-contracts.md provider v0.2.0 шлёт legacy callback
      # без токена и без HMAC; токен используется только adapter'ом
      # как Authorization: Bearer <PROVIDER_CALLBACK_TOKEN> при вызове
      # gateway. В прошлой версии я ошибочно добавил его сюда — убрано.
      - COURSE_TEST_PROFILE=${COURSE_TEST_PROFILE:-1}
    networks:
      - moduldev-network
    restart: unless-stopped

volumes:
  course_pgdata:

networks:
  moduldev-network:
    driver: bridge